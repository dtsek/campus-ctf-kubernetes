apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Release.Name }}-internal-app-escalator-binding
subjects:
- kind: ServiceAccount
  name: internal-app-sa
  namespace: {{ .Values.namespace }}
roleRef:
  kind: ClusterRole
  name: {{ .Release.Name }}-internal-app-escalator
  apiGroup: rbac.authorization.k8s.io
